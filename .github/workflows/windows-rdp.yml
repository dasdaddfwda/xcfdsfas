name: Windows RDP Server with Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          Write-Host "RDP enabled and firewall disabled!" -ForegroundColor Green

      - name: 2. Create Admin Account
        run: |
          net user NvDAdmin P@ssw0rd1qaz /add
          net localgroup administrators NvDAdmin /add
          Write-Host "User 'NvDAdmin' created successfully!" -ForegroundColor Green

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "Downloading Tailscale..." -ForegroundColor Cyan
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          
          Write-Host "Installing Tailscale..." -ForegroundColor Cyan
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          
          Write-Host "Connecting to Tailscale..." -ForegroundColor Cyan
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="windows-rdp-server"
          
          Start-Sleep -Seconds 8
          
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$ts_ip" >> $env:GITHUB_ENV
          
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> TAILSCALE CONNECTED SUCCESSFULLY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP Address: $ts_ip" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Display Connection Information
        run: |
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  ═══════════════════════════════════════════════" -ForegroundColor Cyan
          Write-Host "  ✦ RDP SERVER IS READY! ✦" -ForegroundColor Magenta
          Write-Host "  ═══════════════════════════════════════════════" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  ◈ OS Version  : Windows Server 2022" -ForegroundColor Yellow
          Write-Host "  ◈ IP Address  : $env:TAILSCALE_IP" -ForegroundColor Yellow
          Write-Host "  ◈ Port        : 3389" -ForegroundColor Yellow
          Write-Host "  ◈ Username    : NvDAdmin" -ForegroundColor Yellow
          Write-Host "  ◈ Password    : P@ssw0rd1qaz" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "  ═══════════════════════════════════════════════" -ForegroundColor Cyan
          Write-Host "  HOW TO CONNECT:" -ForegroundColor White
          Write-Host "  1. Open 'Remote Desktop Connection' (mstsc)" -ForegroundColor White
          Write-Host "  2. Enter: $env:TAILSCALE_IP" -ForegroundColor Magenta
          Write-Host "  3. Login with credentials above" -ForegroundColor White
          Write-Host "  ═══════════════════════════════════════════════" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  ⚠️  IMPORTANT: Change password after first login!" -ForegroundColor Red
          Write-Host "==================================================" -ForegroundColor Green

      - name: 5. Keep Server Alive (Up to 6 Hours)
        run: |
          Write-Host "Starting keep-alive loop (6 hours max)..." -ForegroundColor Cyan
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 60 -eq 0) {
              $hours = [math]::Round($i / 60, 1)
              Write-Host "[$hours hours] Server is still running..." -ForegroundColor Green
            }
          }
